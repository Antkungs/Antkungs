<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 170" role="img" aria-label="Party Drink Hub">
  <defs>
    <linearGradient id="g0" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#ff2079"><animate attributeName="stop-color" values="#ff2079;#00f0ff;#a742f5;#ff2079" dur="7s" repeatCount="indefinite"/></stop><stop offset="50%" stop-color="#00f0ff"><animate attributeName="stop-color" values="#00f0ff;#a742f5;#ff2079;#00f0ff" dur="7s" repeatCount="indefinite"/></stop><stop offset="100%" stop-color="#a742f5"><animate attributeName="stop-color" values="#a742f5;#ff2079;#00f0ff;#a742f5" dur="7s" repeatCount="indefinite"/></stop></linearGradient>
    <filter id="f0" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <!-- 3D depth: dark extruded side + floor shadow behind the card -->
  <ellipse cx="230.0" cy="164" rx="200.0" ry="6" fill="#000000" opacity="0.45"/>
  <rect x="9" y="11" width="447" height="155" rx="14" fill="#04060c"/>
  <rect x="6" y="8" width="447" height="155" rx="14" fill="#080b14" stroke="#1b2233" stroke-width="1"/>
  <rect x="1.5" y="1.5" width="447" height="155" rx="14" fill="#0d1117" stroke="url(#g0)" stroke-width="2.5" filter="url(#f0)"/>
  <path d="M18 4.5 H430" stroke="#ffffff" stroke-width="1" opacity="0.14" stroke-linecap="round"/>
  <circle cx="428" cy="28" r="4" fill="#ff2079">
    <animate attributeName="opacity" values="1;0.15;1" dur="1.8s" repeatCount="indefinite"/>
  </circle>
  <circle cx="412" cy="28" r="3" fill="#00f0ff">
    <animate attributeName="opacity" values="0.2;1;0.2" dur="2.4s" repeatCount="indefinite"/>
  </circle>

  <!-- icon: pixel dice tumbling beside a pixel mug -->
  <g transform="translate(18,22)">
    <g fill="#00f0ff">
      <rect x="0" y="6" width="18" height="18" rx="3" fill="none" stroke="#00f0ff" stroke-width="2.2"/>
      <circle cx="5.5" cy="11.5" r="1.8"/><circle cx="12.5" cy="18.5" r="1.8"/><circle cx="12.5" cy="11.5" r="1.8"/><circle cx="5.5" cy="18.5" r="1.8"/>
      <animateTransform attributeName="transform" type="rotate" values="-8 9 15;8 9 15;-8 9 15" dur="2.4s" repeatCount="indefinite"/>
    </g>
    <g>
      <path d="M28 8 h14 v16 a3 3 0 0 1 -3 3 h-8 a3 3 0 0 1 -3 -3 z" fill="none" stroke="#ffde59" stroke-width="2.2"/>
      <path d="M42 12 h4 a3 3 0 0 1 3 3 v3 a3 3 0 0 1 -3 3 h-4" fill="none" stroke="#ffde59" stroke-width="2.2"/>
      <rect x="30.5" y="10.5" width="9" height="4" rx="1.5" fill="#ff2079">
        <animate attributeName="width" values="9;5;9" dur="2.8s" repeatCount="indefinite"/>
      </rect>
      <circle cx="32" cy="6" r="1.4" fill="#ffffff" opacity="0.8"><animate attributeName="cy" values="6;1" dur="2s" repeatCount="indefinite"/><animate attributeName="opacity" values="0.8;0" dur="2s" repeatCount="indefinite"/></circle>
      <circle cx="38" cy="5" r="1.1" fill="#ffffff" opacity="0.7"><animate attributeName="cy" values="5;0" dur="2.6s" repeatCount="indefinite"/><animate attributeName="opacity" values="0.7;0" dur="2.6s" repeatCount="indefinite"/></circle>
    </g>
  </g>
  <text x="86" y="52" font-family="Segoe UI,Arial,sans-serif" font-weight="700" font-size="19" fill="#ffffff">Party Drink Hub</text>
  <rect x="86" y="62" height="2.5" rx="1.25" fill="url(#g0)" width="0">
    <animate attributeName="width" values="0;338;338;0" dur="7s" repeatCount="indefinite"/>
  </rect>
  <text x="26" y="104" font-family="Segoe UI,Arial,sans-serif" font-size="13.5" fill="#8b949e">Pixel-art party game hub — Spirit Dak! &amp; friends • LIVE</text>
  <rect x="26" y="124" width="60" height="22" rx="11" fill="#ff20791a" stroke="#ff2079" stroke-width="1"/><text x="56.0" y="139" text-anchor="middle" font-family="Courier New,monospace" font-size="11" fill="#ff2079">React</text><rect x="94" y="124" width="86" height="22" rx="11" fill="#a742f51a" stroke="#a742f5" stroke-width="1"/><text x="137.0" y="139" text-anchor="middle" font-family="Courier New,monospace" font-size="11" fill="#a742f5">Pixel Art</text><rect x="188" y="124" width="110" height="22" rx="11" fill="#50fa7b1a" stroke="#50fa7b" stroke-width="1"/><text x="243.0" y="139" text-anchor="middle" font-family="Courier New,monospace" font-size="11" fill="#50fa7b">GitHub Pages</text>
</svg>
