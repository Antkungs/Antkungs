<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 170" role="img" aria-label="Meet Halfway">
  <defs>
    <linearGradient id="g0" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#ff2079"><animate attributeName="stop-color" values="#ff2079;#00f0ff;#a742f5;#ff2079" dur="7s" repeatCount="indefinite"/></stop><stop offset="50%" stop-color="#00f0ff"><animate attributeName="stop-color" values="#00f0ff;#a742f5;#ff2079;#00f0ff" dur="7s" repeatCount="indefinite"/></stop><stop offset="100%" stop-color="#a742f5"><animate attributeName="stop-color" values="#a742f5;#ff2079;#00f0ff;#a742f5" dur="7s" repeatCount="indefinite"/></stop></linearGradient>
    <filter id="f0" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <!-- 3D depth: dark extruded side + floor shadow behind the card -->
  <ellipse cx="230.0" cy="164" rx="200.0" ry="6" fill="#000000" opacity="0.45"/>
  <rect x="9" y="11" width="447" height="155" rx="14" fill="#04060c"/>
  <rect x="6" y="8" width="447" height="155" rx="14" fill="#080b14" stroke="#1b2233" stroke-width="1"/>
  <rect x="1.5" y="1.5" width="447" height="155" rx="14" fill="#0d1117" stroke="url(#g0)" stroke-width="2.5" filter="url(#f0)"/>
  <path d="M18 4.5 H430" stroke="#ffffff" stroke-width="1" opacity="0.14" stroke-linecap="round"/>
  <circle cx="428" cy="28" r="4" fill="#ff2079">
    <animate attributeName="opacity" values="1;0.15;1" dur="1.8s" repeatCount="indefinite"/>
  </circle>
  <circle cx="412" cy="28" r="3" fill="#00f0ff">
    <animate attributeName="opacity" values="0.2;1;0.2" dur="2.4s" repeatCount="indefinite"/>
  </circle>

  <!-- icon: two friends' pins + dashed route + glowing midpoint -->
  <g transform="translate(18,22)">
    <path d="M4 22 Q22 6 40 22" fill="none" stroke="#00f0ff" stroke-width="1.6" stroke-dasharray="4 3" opacity="0.85">
      <animate attributeName="stroke-dashoffset" values="14;0" dur="1.6s" repeatCount="indefinite"/>
    </path>
    <path d="M4 22 c-3.5 -5.5 -3.5 -10 0 -12.5 c3.5 2.5 3.5 7 0 12.5 z" fill="#ff2079"/>
    <circle cx="4" cy="13" r="1.6" fill="#0d1117"/>
    <path d="M40 22 c-3.5 -5.5 -3.5 -10 0 -12.5 c3.5 2.5 3.5 7 0 12.5 z" fill="#a742f5"/>
    <circle cx="40" cy="13" r="1.6" fill="#0d1117"/>
    <circle cx="22" cy="13" r="4" fill="#ffde59">
      <animate attributeName="r" values="3.2;5;3.2" dur="2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="1;0.5;1" dur="2s" repeatCount="indefinite"/>
    </circle>
  </g>
  <text x="86" y="52" font-family="Segoe UI,Arial,sans-serif" font-weight="700" font-size="19" fill="#ffffff">Meet Halfway</text>
  <rect x="86" y="62" height="2.5" rx="1.25" fill="url(#g0)" width="0">
    <animate attributeName="width" values="0;338;338;0" dur="7s" repeatCount="indefinite"/>
  </rect>
  <text x="26" y="104" font-family="Segoe UI,Arial,sans-serif" font-size="13.5" fill="#8b949e">Fair meeting-point finder • shareable URL state • LIVE</text>
  <rect x="26" y="124" width="60" height="22" rx="11" fill="#ff20791a" stroke="#ff2079" stroke-width="1"/><text x="56.0" y="139" text-anchor="middle" font-family="Courier New,monospace" font-size="11" fill="#ff2079">React</text><rect x="94" y="124" width="52" height="22" rx="11" fill="#00f0ff1a" stroke="#00f0ff" stroke-width="1"/><text x="120.0" y="139" text-anchor="middle" font-family="Courier New,monospace" font-size="11" fill="#00f0ff">Vite</text><rect x="154" y="124" width="118" height="22" rx="11" fill="#a742f51a" stroke="#a742f5" stroke-width="1"/><text x="213.0" y="139" text-anchor="middle" font-family="Courier New,monospace" font-size="11" fill="#a742f5">OpenStreetMap</text><rect x="280" y="124" width="110" height="22" rx="11" fill="#50fa7b1a" stroke="#50fa7b" stroke-width="1"/><text x="335.0" y="139" text-anchor="middle" font-family="Courier New,monospace" font-size="11" fill="#50fa7b">GitHub Pages</text>
</svg>
